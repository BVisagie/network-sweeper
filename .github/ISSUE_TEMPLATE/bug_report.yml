name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Network Sweeper. Please search existing issues first.
        Security-sensitive reports belong in [SECURITY.md](https://github.com/BVisagie/network-sweeper/blob/main/SECURITY.md), not here.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version pill in the UI, or the string printed at startup (e.g. v0.2.0).
      placeholder: v0.x.y
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: Optional (amd64, arm64, …).
      placeholder: arm64
  - type: dropdown
    id: elevated
    attributes:
      label: Elevated process?
      description: Running as Administrator / with sudo?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Do not include unrelated network details you cannot share.
      placeholder: |
        1. Start with -no-browser
        2. Accept consent
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include UI messages, Limitations notes, or scan warnings if relevant.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checks
      options:
        - label: I only scanned networks I own or am authorized to assess.
          required: true
        - label: I verified checksums for a release binary (or built from this repo’s source).
          required: false
